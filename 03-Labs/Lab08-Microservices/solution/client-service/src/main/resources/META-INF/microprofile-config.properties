# Client Microservice Configuration

# Service Information
service.name=client-service
service.version=1.0.0
service.description=Client Management Microservice

# Database Configuration (overridden by environment variables)
db.host=localhost
db.port=5433
db.name=banking_client_db
db.user=bankuser
db.password=bankpass

# Logging Configuration
logging.level=INFO
logging.format=json

# Health Check Configuration
health.check.enabled=true
health.check.readiness.timeout=5000

# Metrics Configuration
metrics.enabled=true
metrics.vendor.enabled=true
metrics.application.enabled=true

