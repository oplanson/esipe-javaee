# Account Microservice Configuration

# Service Information
service.name=account-service
service.version=1.0.0
service.description=Account Management Microservice

# Database Configuration (overridden by environment variables)
db.host=localhost
db.port=5434
db.name=banking_account_db
db.user=bankuser
db.password=bankpass

# Client Service REST Client Configuration
com.bank.account.infrastructure.client.ClientServiceClient/mp-rest/url=http://localhost:9081/api
com.bank.account.infrastructure.client.ClientServiceClient/mp-rest/scope=jakarta.inject.Singleton

# Fault Tolerance Configuration
# Circuit Breaker
mp.fault.tolerance.circuit.breaker.requestVolumeThreshold=4
mp.fault.tolerance.circuit.breaker.failureRatio=0.5
mp.fault.tolerance.circuit.breaker.delay=5000
mp.fault.tolerance.circuit.breaker.successThreshold=2

# Retry
mp.fault.tolerance.retry.maxRetries=3
mp.fault.tolerance.retry.delay=1000
mp.fault.tolerance.retry.maxDuration=10000

# Timeout
mp.fault.tolerance.timeout.value=2000

# Logging Configuration
logging.level=INFO
logging.format=json

# Health Check Configuration
health.check.enabled=true
health.check.readiness.timeout=5000

# Metrics Configuration
metrics.enabled=true
metrics.vendor.enabled=true
metrics.application.enabled=true

# Made with Bob
