# Bootstrap properties for Account Microservice
# Port 9080 is the standard Liberty HTTP port inside the container
# The host port mapping is handled by Podman/Docker
http.port=9080
https.port=9443

# Default database configuration for container deployment
# These defaults work for both local development and container deployment
# Container environment variables will override these if set
env.DB_HOST=banking-account-db
env.DB_PORT=5432
env.DB_NAME=banking_account_db
env.DB_USER=bankuser
env.DB_PASSWORD=bankpass

