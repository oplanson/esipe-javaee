# Application Configuration
app.name=Banking API Gateway
app.version=1.0.0

# Client Service REST Client Configuration
# Use container names for inter-service communication in Podman/Docker network
com.bank.gateway.client.ClientServiceClient/mp-rest/url=http://banking-client-service:9080/api
com.bank.gateway.client.ClientServiceClient/mp-rest/scope=jakarta.inject.Singleton

# Account Service REST Client Configuration
com.bank.gateway.client.AccountServiceClient/mp-rest/url=http://banking-account-service:9080/api
com.bank.gateway.client.AccountServiceClient/mp-rest/scope=jakarta.inject.Singleton

# Fault Tolerance Configuration
# Circuit Breaker
mp.fault.tolerance.circuit.breaker.requestVolumeThreshold=4
mp.fault.tolerance.circuit.breaker.failureRatio=0.5
mp.fault.tolerance.circuit.breaker.delay=5000
mp.fault.tolerance.circuit.breaker.successThreshold=2

# Retry
mp.fault.tolerance.retry.maxRetries=3
mp.fault.tolerance.retry.delay=1000
mp.fault.tolerance.retry.maxDuration=10000

# Timeout
mp.fault.tolerance.timeout.value=3000

# Bulkhead
mp.fault.tolerance.bulkhead.value=10
mp.fault.tolerance.bulkhead.waitingTaskQueue=10

# Made with Bob
