# MicroProfile Config properties
# Lab 05 - JAX-RS and RESTful Web Services

# Application configuration
app.name=Lab 05 - JAX-RS and RESTful Web Services
app.version=1.0.0

# Web configuration
web.pagination.default.size=10
feature.client.deletion.enabled=true
feature.account.deletion.enabled=true
feature.account.transfer.enabled=true

# Database configuration (for reference, actual values in bootstrap.properties)
db.host=localhost
db.port=5432
db.name=bankdb
db.user=bankuser

# MicroProfile Rest Client Configuration
banking-api/mp-rest/url=http://localhost:9080
banking-api/mp-rest/scope=jakarta.inject.Singleton
banking-api/mp-rest/connectTimeout=5000
banking-api/mp-rest/readTimeout=10000

