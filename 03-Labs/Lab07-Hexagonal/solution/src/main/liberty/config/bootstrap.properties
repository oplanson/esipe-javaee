# Bootstrap properties for Open Liberty server
# Lab 07 - Hexagonal Architecture

# HTTP ports
http.port=9080
https.port=9443

# Database connection properties
# Note: db_host should be overridden when running in containers
# Use 'postgres' service name when running with docker-compose
# Use 'localhost' only for local Liberty development
# Liberty automatically converts underscores to dots (db_host -> db.host)
db_host=postgres
db_port=5432
db_name=bankingdb
db_user=bankuser
db_password=bankpass

# Application name
app.name=Banking Hexagonal Architecture Application

