# MicroProfile Configuration for Banking Hexagonal Architecture Application

# Application Information
app.name=Banking Hexagonal Architecture Application
app.version=1.0.0
app.description=Lab 07 - Hexagonal Architecture (Ports and Adapters)

# Database Configuration
db.url=jdbc:postgresql://localhost:5432/bankdb
db.username=bankuser
db.password=bankpass
db.pool.min=5
db.pool.max=20

# Flyway Configuration
flyway.enabled=true
flyway.baseline-on-migrate=true
flyway.locations=classpath:db/migration

# Logging Configuration
logging.level=INFO
logging.sql.show=true
logging.sql.format=true

