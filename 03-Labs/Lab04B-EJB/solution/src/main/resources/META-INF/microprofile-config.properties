# MicroProfile Config properties

# Application configuration
app.name=Lab 04B - EJB Banking
app.version=1.0.0
app.description=Enterprise Java Beans demonstration with banking operations

# Database configuration
db.host=localhost
db.port=5432
db.name=bankingdb
db.user=bankuser
db.password=bankpass
db.pool.min=5
db.pool.max=20

# EJB configuration
ejb.stateless.pool.max=100
ejb.timer.late.threshold=5m
ejb.timer.retry.max=3
ejb.timer.retry.interval=30s

# JMS configuration
jms.queue.notification=jms/notificationQueue
jms.queue.maxConcurrency=5

# Transaction configuration
transaction.timeout=120s
transaction.client.timeout=60s

# Security configuration
security.realm=BankingRealm
security.admin.username=admin
security.admin.password=admin123
security.teller.username=teller
security.teller.password=teller123
security.customer.username=customer
security.customer.password=customer123

# Logging configuration
logging.level=INFO
logging.ejb.level=ALL
logging.transaction.level=ALL

# Health check configuration
health.check.enabled=true
health.check.database.enabled=true
health.check.database.timeout=5s

# Metrics configuration
metrics.enabled=true
metrics.authentication=false

