<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Client - Banking Application</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Client-side validation
        function validateForm() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if (name === '' || email === '' || phone === '') {
                alert('All fields are required!');
                return false;
            }
            
            if (name.length < 2) {
                alert('Name must be at least 2 characters long!');
                return false;
            }
            
            // Basic email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address!');
                return false;
            }
            
            // Basic phone validation
            const phonePattern = /^[\d\s\-\+\(\)]+$/;
            if (!phonePattern.test(phone)) {
                alert('Please enter a valid phone number!');
                return false;
            }
            
            return true;
        }
        
        // Display error message if present in URL
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            
            if (error === 'missing') {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message error';
                errorDiv.innerHTML = '⚠ All fields are required. Please fill in all information.';
                document.querySelector('.card').insertBefore(errorDiv, document.querySelector('form'));
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>➕ Add New Client</h1>
        <p class="subtitle">Enter client information below</p>
        
        <div class="card">
            <h2>Client Information</h2>
            
            <form action="clients" method="POST" onsubmit="return validateForm()">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter client's full name"
                        required
                        minlength="2"
                        maxlength="100">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="client@example.com"
                        required
                        maxlength="100">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="+1-555-0100"
                        required
                        maxlength="20">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn">💾 Save Client</button>
                    <a href="clients" class="btn btn-secondary">❌ Cancel</a>
                </div>
            </form>
            
            <div class="mt-20">
                <p><small>* Required fields</small></p>
            </div>
        </div>
        
        <footer>
            <p>© Copyright 2025-2026 Olivier Planson. All rights reserved. Reproduction prohibited. Made with IBM Bob.</p>
        </footer>
    </div>
</body>
</html>
