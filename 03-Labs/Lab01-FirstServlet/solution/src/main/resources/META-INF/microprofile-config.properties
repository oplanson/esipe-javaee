# MicroProfile Configuration for Banking Application
# Lab 01 - First Servlet

# Application Information
app.name=Banking Application
app.version=1.0.0
app.description=Jakarta EE Banking Application with Servlets

# Server Configuration
server.host=localhost
server.port=9080
server.context.root=/

# Health Check Configuration
health.check.enabled=true
health.check.interval=30

# Metrics Configuration
metrics.enabled=true
metrics.vendor.enabled=true

# OpenAPI Configuration
openapi.enabled=true
openapi.title=Banking Application API
openapi.version=1.0.0
openapi.description=REST API for Banking Application

# Application Features
feature.client.management=true
feature.welcome.page=true

# Logging Configuration
logging.level=INFO
logging.format=json

# Security (for future labs)
security.enabled=false

# Database (for future labs)
database.enabled=false

