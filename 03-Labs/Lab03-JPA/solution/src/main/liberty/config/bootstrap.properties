# Bootstrap properties for Open Liberty server
# Lab 03 - JPA and Database Integration

# HTTP ports
http.port=9080
https.port=9443

# Database connection properties
# Note: DB_HOST should be overridden when running in containers
# Use 'host.containers.internal' for Podman/Docker to access host services
# Use 'localhost' only for local Liberty development
DB_HOST=host.containers.internal
DB_PORT=5432
DB_NAME=bankdb
DB_USER=bankuser
DB_PASSWORD=bankpass

# Application name
app.name=Banking JPA Application

